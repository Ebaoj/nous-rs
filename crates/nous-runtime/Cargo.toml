[package]
name = "nous-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime executor, store, memory, and concept graphs for the Nous protocol"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "nous-core/serde", "nous-protocol/serde"]
async = ["dep:tokio", "dep:async-trait"]
full = ["serde", "async"]

[dependencies]
nous-core = { workspace = true }
nous-protocol = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Optional
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
